<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>專案索引</title>
<style>
:root{--bg:#0b1024;--panel:#141b38;--ink:#e8ecf8;--dim:#8f98bb;--line:#2a3463;--gold:#ffc861}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px max(2vw,12px);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:clamp(17px,2.2vw,22px);font-weight:900}
h1 span{color:var(--dim);font-weight:400;font-size:.72em;margin-inline-start:8px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 15px;min-height:38px;cursor:pointer}
button:hover{border-color:#5566c4}
.zoom{display:flex;align-items:center;gap:8px}
.zoom button{min-height:32px;padding:2px 11px}
input[type=range]{width:min(180px,34vw);accent-color:#e8634a}
.zoom output{font-size:13px;color:var(--dim);width:3.2em;text-align:end}
main{flex:1;display:flex;min-height:0}
#wrap{flex:1;overflow:auto;padding:16px}
#msg{color:var(--dim);padding:40px 20px;font-size:16px}
svg text{font-family:inherit;dominant-baseline:middle}
.lk{fill:none;transition:opacity .25s}
.nd{cursor:pointer}
.nd rect{stroke-width:1}
.nd{transition:opacity .25s}.nd.dim{opacity:.25}
.open{fill:var(--gold);font-size:12px;cursor:pointer}
aside{width:min(300px,42vw);border-left:1px solid var(--line);padding:16px;overflow:auto;display:none}
aside.on{display:block}
aside h2{margin:0 0 6px;font-size:19px}
aside .k{font-size:13px;color:var(--dim);margin:12px 0 6px}
aside .tags{display:flex;flex-wrap:wrap;gap:6px}
aside .tags b{font-weight:400;font-size:13px;padding:3px 10px;border-radius:999px;background:#1d2550;border:1px solid var(--line)}
aside .x{float:right;min-height:30px;padding:0 10px}
@media(max-width:700px){main{flex-direction:column}aside{width:auto;border-left:0;border-top:1px solid var(--line);max-height:40vh}}
</style>
</head>
<body>
<header>
  <h1 id="ttl">專案索引</h1>
  <div class="ctl">
    <div class="zoom">
      <button id="zOut" aria-label="縮小">－</button>
      <input id="zr" type="range" min="40" max="200" value="100" aria-label="縮放">
      <button id="zIn" aria-label="放大">＋</button>
      <output id="zv">100%</output>
    </div>
  </div>
</header>
<main>
  <div id="wrap"><div id="msg">讀取中…</div><svg id="tree" style="display:none"></svg></div>
  <aside id="side"></aside>
</main>
<script>
{
const OWNER='BearBabyBaby-ai';
/* 不列入的程式庫 */
const SKIP=['bear-game','adsb-list','bearbabybaby-ai.github.io','repository-name'];
/* 已知系統的中文名稱；新程式庫會自動用它網頁的標題 */
const NAME={'bearbear':'熊熊綜合系統','bearbao':'熊寶系統','bearbao-mini':'熊寶小資訊','lantern-festival':'2027澎湖元宵','penghu-bear-journey':'熊熊澎湖之旅','penghu-food':'澎湖資訊推薦'};
/* 功能分類與判斷用的關鍵字（程式碼裡出現兩次以上才算有這項功能） */
const CATS=[
 ['在地資料','#6fa8ff',[['美食',['美食']],['景點',['景點']],['廟宇',['廟宇']],['其他店家',['其他店家']],['行程業者',['行程業者']],['港口與遊客中心',['遊客中心']]]],
 ['潮汐天氣','#4fd6d0',[['奎壁山分海',['奎壁山']],['30天潮汐預報',['30天潮汐','潮汐預報']],['風浪天氣',['風浪']],['池西岩瀑',['池西岩瀑']]]],
 ['交通航班','#f2d65a',[['航班動態',['航班']],['查機位',['查機位']],['候補資訊',['候補']],['船舶動態',['船舶']]]],
 ['地圖導航','#ff9a4d',[['互動地圖',['地圖']],['立體地圖',['3D']],['導航',['導航']],['路線',['路線']],['測速與科技執法',['測速']]]],
 ['活動廟宇','#ff6f7d',[['月曆活動',['月曆']],['元宵資訊',['元宵']],['花火節',['花火']],['集章',['集章']],['主祀判斷',['主祀']]]],
 ['個人管理','#b68cff',[['重要資訊提醒',['重要資訊提醒']],['財務管理',['財務']],['機票搶票提醒',['搶票']],['特殊日期生日',['特殊日期']],['工作模式查詢',['工作模式']],['後台編修',['後台']]]]
];
const BAD=/(^|\/)(lib|libs|node_modules|tests?|assets|icons|scripts|tools|sources|docs|google-sites|build|apk|\.github|native\/www|www\/lib|leaflet|markercluster)\//i;
const CODE=/\.(html|js|cjs|mjs)$/i;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);

async function j(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}
async function t(u){try{const r=await fetch(u);return r.ok?await r.text():''}catch(e){return ''}}
const raw=(repo,br,p)=>`https://raw.githubusercontent.com/${OWNER}/${repo}/${br}/${p.split('/').map(encodeURIComponent).join('/')}`;
const count=(txt,kws)=>kws.reduce((s,k)=>s+txt.split(k).length-1,0);

async function load(){
 const repos=(await j(`https://api.github.com/users/${OWNER}/repos?per_page=100`)).filter(r=>!r.fork&&r.size>0&&!SKIP.includes(r.name.toLowerCase()));
 const systems=[];
 await Promise.all(repos.map(async r=>{
  const br=r.default_branch;
  const tree=(await j(`https://api.github.com/repos/${OWNER}/${r.name}/git/trees/${br}?recursive=1`)).tree.filter(x=>x.type==='blob');
  /* 程式庫裡獨立成另一支程式的資料夾（例如桌寵程式） */
  const subs=[...new Set(tree.filter(x=>/^[^\/]+-app\/package\.json$/.test(x.path)).map(x=>x.path.split('/')[0]))];
  const files=tree.filter(x=>CODE.test(x.path)&&!BAD.test(x.path)&&!/\.min\.js$|(^|\/)sw\.js$/.test(x.path)&&x.size<3e6);
  const read=async list=>(await Promise.all(list.map(x=>t(raw(r.name,br,x.path))))).join('\n');
  const mainFiles=files.filter(x=>!subs.some(s=>x.path.startsWith(s+'/')));
  let name=NAME[r.name.toLowerCase()];
  if(!name){const idx=tree.find(x=>/(^|\/)index\.html$/.test(x.path));const h=idx?await t(raw(r.name,br,idx.path)):'';name=(h.match(/<title>([^<]+)/)||[])[1]||r.name}
  systems.push({n:name.trim(),u:r.homepage||`https://${OWNER.toLowerCase()}.github.io/${r.name}/`,txt:await read(mainFiles),at:r.pushed_at});
  for(const s of subs){
   const pk=await t(raw(r.name,br,s+'/package.json'));let nm=s;try{nm=JSON.parse(pk).productName||s}catch(e){}
   systems.push({n:nm,u:`https://github.com/${OWNER}/${r.name}/releases`,txt:await read(files.filter(x=>x.path.startsWith(s+'/'))),at:r.pushed_at});
  }
 }));
 systems.sort((a,b)=>a.n.localeCompare(b.n,'zh-Hant'));
 return systems;
}

let SY=[],FE=[],LK=[],zoom=1,sel=null,hov=null;
function build(systems){
 SY=systems.map((s,i)=>({i,n:s.n,u:s.u,t:'s'}));FE=[];LK=[];
 CATS.forEach(([cn,col,fs])=>fs.forEach(([fn,kw])=>{
  const owners=systems.map((s,i)=>count(s.txt,kw)>=2?i:-1).filter(i=>i>=0);
  if(!owners.length)return;
  const f={i:FE.length,n:fn,c:cn,col,t:'f'};FE.push(f);owners.forEach(o=>LK.push({s:SY[o],f}));
 }));
 $('ttl').innerHTML=`專案索引<span>${SY.length} 個系統・${FE.length} 項功能・${LK.length} 條關聯</span>`;
}
const ROW=30,GAP=26,SX=0,FX=520,SW=150;
function layout(){
 let y=0,last='';const heads=[];
 FE.forEach(f=>{if(f.c!==last){if(last)y+=GAP;heads.push({n:f.c,col:f.col,y});y+=ROW;last=f.c}f.y=y;y+=ROW});
 const H=y,step=H/(SY.length);
 SY.forEach((s,i)=>s.y=step*(i+.5));
 return {H,heads};
}
const fw=f=>f.n.length*13.5+20;
let paths=[],sg=[],fg=[];
function draw(){
 const {H,heads}=layout(),W=FX+260,svg=$('tree');
 svg.setAttribute('viewBox',`-6 -18 ${W} ${H+24}`);svg.setAttribute('width',W*zoom);svg.setAttribute('height',(H+24)*zoom);
 let h='';
 LK.forEach((l,i)=>h+=`<path class="lk" data-i="${i}" stroke="${l.f.col}"/>`);
 heads.forEach(c=>h+=`<text x="${FX}" y="${c.y}" fill="${c.col}" font-size="13" font-weight="700">${esc(c.n)}</text>`);
 SY.forEach(s=>h+=`<g class="nd" data-t="s" data-i="${s.i}"><rect x="0" y="-14" rx="8" width="${SW}" height="28" fill="#3a2a08" stroke="#ffc861"/><text x="12" y="1" fill="#ffe2a3" font-size="15" font-weight="700">${esc(s.n)}</text></g>`);
 FE.forEach(f=>h+=`<g class="nd" data-t="f" data-i="${f.i}"><rect x="0" y="-11" rx="6" width="${fw(f)}" height="22" fill="#141b38" stroke="${f.col}"/><text x="10" y="1" fill="#e3e8fb" font-size="13">${esc(f.n)}</text></g>`);
 svg.innerHTML=h;
 paths=[...svg.querySelectorAll('path')];sg=[...svg.querySelectorAll('[data-t=s]')];fg=[...svg.querySelectorAll('[data-t=f]')];
 mark();
}
function mark(){
 const f=sel||hov;
 const on=l=>!f||l.s===f||l.f===f;
 paths.forEach((p,i)=>{const o=on(LK[i]);p.style.opacity=f?(o?.95:.06):.35;p.style.strokeWidth=f&&o?2.4:1.3});
 const rel=new Set();if(f)LK.forEach(l=>{if(l.s===f)rel.add(l.f);if(l.f===f)rel.add(l.s)});
 sg.forEach((g,i)=>g.classList.toggle('dim',!!f&&SY[i]!==f&&!rel.has(SY[i])));
 fg.forEach((g,i)=>g.classList.toggle('dim',!!f&&FE[i]!==f&&!rel.has(FE[i])));
}
/* 樹枝像被風吹一樣緩慢擺動，相鄰名稱一起上下，不會疊在一起 */
function anim(){
 const tm=performance.now()/1000;
 SY.forEach((s,i)=>{s.ax=SX+Math.sin(tm*.55+i*1.3)*10;s.ay=s.y+Math.sin(tm*.5+s.y*.006)*10;sg[i]&&sg[i].setAttribute('transform',`translate(${s.ax},${s.ay})`)});
 FE.forEach((f,i)=>{f.ax=FX+Math.sin(tm*.6+i*.45)*16;f.ay=f.y+Math.sin(tm*.5+f.y*.006)*7;fg[i]&&fg[i].setAttribute('transform',`translate(${f.ax},${f.ay})`)});
 LK.forEach((l,i)=>{const x1=l.s.ax+SW,y1=l.s.ay,x2=l.f.ax,y2=l.f.ay,m=(x1+x2)/2;paths[i]&&paths[i].setAttribute('d',`M${x1},${y1}C${m},${y1} ${m},${y2} ${x2},${y2}`)});
 requestAnimationFrame(anim);
}
function side(n){
 const sd=$('side');sel=n;mark();if(!n){sd.className='';return}
 const tags=a=>`<div class="tags">${a.map(x=>`<b>${esc(x)}</b>`).join('')}</div>`;
 if(n.t==='f'){
  const ss=LK.filter(l=>l.f===n).map(l=>l.s.n);
  sd.innerHTML=`<button class="x">✕</button><h2>${esc(n.n)}</h2><div class="k">有這項功能的系統（${ss.length}）</div>${tags(ss)}`;
 }else{
  const fs=LK.filter(l=>l.s===n).map(l=>l.f);
  const shared=SY.filter(s=>s!==n).map(s=>[s.n,fs.filter(f=>LK.some(l=>l.s===s&&l.f===f)).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
  sd.innerHTML=`<button class="x">✕</button><h2>${esc(n.n)}</h2><div class="k">功能（${fs.length}）</div>${tags(fs.map(f=>f.n))}<div class="k">共用功能的系統</div>${tags(shared.map(x=>`${x[0]}　${x[1]} 項`))}<p><a href="${esc(n.u)}" target="_blank" rel="noopener" style="color:var(--gold)">開啟系統</a></p>`;
 }
 sd.className='on';sd.querySelector('.x').onclick=()=>side(null);
}
const pick=e=>{const g=e.target.closest('.nd');return g?(g.dataset.t==='s'?SY:FE)[+g.dataset.i]:null};
$('tree').addEventListener('click',e=>{const n=pick(e);side(n&&n!==sel?n:null)});
$('tree').addEventListener('mouseover',e=>{hov=pick(e);mark()});
$('tree').addEventListener('mouseleave',()=>{hov=null;mark()});
const zr=$('zr');
function setZoom(v){v=Math.max(40,Math.min(200,v));zr.value=v;zoom=v/100;$('zv').textContent=v+'%';if(SY.length)draw()}
zr.addEventListener('input',()=>setZoom(+zr.value));
$('zIn').onclick=()=>setZoom(+zr.value+10);$('zOut').onclick=()=>setZoom(+zr.value-10);
load().then(s=>{build(s);requestAnimationFrame(anim);$('msg').remove();$('tree').style.display='';
 const fit=Math.floor(($('wrap').clientWidth-32)/(FX+260)*100);setZoom(Math.min(100,Math.max(40,fit)));
}).catch(e=>{$('msg').textContent='讀取失敗，請稍後重新整理'});
}
</script>
</body>
</html>
