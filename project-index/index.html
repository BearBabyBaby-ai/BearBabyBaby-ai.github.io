<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>熊寶總控系統</title>
<link rel="icon" href="favicon.ico">
<style>html,body{margin:0;background:#0b1024}</style>
<script>
/* GitHub 會讓瀏覽器把頁面暫存 10 分鐘，連新開的分頁也一樣；這裡每次都直接抓最新版，改完馬上看得到 */
fetch('app.html?' + Date.now(), { cache: 'no-store' })
  .then(function (r) { return r.text(); })
  .then(function (html) { document.open(); document.write(html); document.close(); });
</script>
</head>
<body></body>
</html>
