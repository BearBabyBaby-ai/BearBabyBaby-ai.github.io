<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>專案索引</title>
<style>
:root{--ink:#000000;--dim:#6b5a44;--line:#e2cba6;--frame:#876c4b;--head:#f6e7cf;--label:#fbf3e4;--blue:#0a6fb3;--bg1:#eaf6fb;--bg2:#f3fbf2}
/* 色調比照熊寶系統電腦版的熊寶桌寵對話框：底色跟著時間區段（清晨、白天、傍晚、晚上） */
body{--h1:#0a6fb3;--h2:#1993c4;--h3:#34b6b8;--acc:#f4c430}
body[data-tod="dawn"]{--bg1:#fff1e8;--bg2:#e8f0fb;--h1:#c2577f;--h2:#ee8f6b;--h3:#f4bf74;--acc:#ffd27a}
body[data-tod="day"]{--bg1:#eaf6fb;--bg2:#f3fbf2}
body[data-tod="dusk"]{--bg1:#ffe9dc;--bg2:#f7d9d3;--h1:#6b2a5e;--h2:#c2464f;--h3:#ee8a3c;--acc:#ffc861}
body[data-tod="night"]{--bg1:#18213f;--bg2:#28305c;--h1:#0b1430;--h2:#1c2a5a;--h3:#39306e;--acc:#ffd66b}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;overflow:clip;max-width:100vw}
body{-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
body{overflow:hidden;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);font:15px/1.5 "Microsoft JhengHei","微軟正黑體","Noto Sans TC",system-ui,sans-serif;display:flex;flex-direction:column;transition:background .8s}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:10px max(2vw,12px);background:#f6e7cf;border-bottom:1.5px solid #e2cba6;color:#000}
h1{margin:0;font-size:clamp(17px,2.2vw,22px);font-weight:900}
h1 span{color:var(--dim);font-weight:400;font-size:.72em;margin-inline-start:8px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:14px;color:var(--blue);background:#fff;border:1.5px solid var(--blue);border-radius:10px;padding:6px 14px;min-height:36px;cursor:pointer}
button:hover{background:#e8f2fa}
.zoom{display:flex;align-items:center;gap:8px}
.zoom button{min-height:32px;padding:2px 11px}
input[type=range]{width:min(180px,34vw);accent-color:var(--blue)}
.zoom .lb{font-size:13px;color:var(--dim)}
.zoom output{font-size:13px;color:var(--dim);width:3.6em;text-align:end}
main{flex:1;display:flex;min-height:0}
#wrap{flex:1;position:relative;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#msg{position:absolute;inset:0;color:var(--dim);padding:40px 20px;font-size:16px;z-index:1}
aside{width:min(360px,42vw);border-left:1.5px solid var(--line);display:none;flex-direction:column;min-height:0;background:linear-gradient(180deg,var(--bg1),var(--bg2))}
aside.on{display:flex}
#info{padding:16px;overflow:auto;flex:none;max-height:100%}
#info:empty{display:none}
aside.chat #info{display:none}
aside h2{margin:0 0 6px;font-size:19px}
aside .k{font-size:13px;color:var(--dim);margin:12px 0 6px}
aside .tags{display:flex;flex-wrap:wrap;gap:6px}
aside .tags b{font-weight:400;font-size:13px;padding:3px 10px;border-radius:999px;background:#fff;border:1.5px solid var(--line);color:#000}
aside .x{float:right;min-height:30px;padding:0 10px}
aside a{color:var(--blue)!important}
body[data-tod="night"] aside h2{color:#fff}
header h1,header h1 span,header .lb,header output{color:#4a3b28!important}
header h1{color:#000!important}
body[data-tod="night"] aside .k{color:#c8cfe8}
body[data-tod="night"] aside{border-left-color:#3a4472}
/* 左邊系統列表 */
#list{width:min(210px,34vw);border-right:1.5px solid var(--line);padding:14px 10px;overflow:auto;display:flex;flex-direction:column;gap:6px;background:var(--label)}
#list button{text-align:start;border-radius:10px;width:100%;font-size:15px;font-weight:700;color:#fff;background:var(--sc);border:2px solid var(--sc)}
#list button:hover{filter:brightness(1.08)}
#list button.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--sc)}
/* 熊寶查詢（和熊寶桌寵一樣） */
#deskBox{flex:1;min-height:0;display:none}
aside.chat #deskBox{display:block}
#desk{width:100%;height:100%;border:0;background:transparent;display:block}
#pet{position:absolute;right:10px;bottom:4px;width:clamp(110px,14vw,170px);height:auto;cursor:grab;z-index:2;touch-action:none;-webkit-user-drag:none}
@media(max-width:700px){main{flex-direction:column}#list{width:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1.5px solid var(--line);max-height:30vh}#list button{width:auto}aside{width:auto;border-left:0;border-top:1.5px solid var(--line);max-height:40vh}}
</style>
</head>
<body>
<header>
  <h1 id="ttl">專案索引</h1>
  <div class="ctl">
    <button id="bReset">重新排列</button>
    <div class="zoom"><span class="lb">速度</span><input id="sp" type="range" min="0" max="1000" step="10" value="100" aria-label="速度"><output id="spv">100%</output></div>
    <div class="zoom">
      <span class="lb">縮放</span><button id="zOut" aria-label="縮小">－</button>
      <input id="zr" type="range" min="40" max="200" value="100" aria-label="縮放">
      <button id="zIn" aria-label="放大">＋</button>
      <output id="zv">100%</output>
    </div>
  </div>
</header>
<main>
  <nav id="list"></nav>
  <div id="wrap"><div id="msg">讀取中…</div><canvas id="cv"></canvas><img id="pet" title="點我查詢" src="" alt="熊寶桌寵"></div>
  <aside id="side"><div id="info"></div><div id="deskBox"><iframe id="desk" title="熊寶工作中"></iframe></div></aside>
</main>
<script>
{
const OWNER='BearBabyBaby-ai';
/* 功能分類與判斷用的關鍵字（程式碼裡出現兩次以上才算有這項功能） */
const CATS=[
 ['在地資料','#0a6fb3',[['美食',['美食']],['景點',['景點']],['廟宇',['廟宇']],['其他店家',['其他店家']],['行程業者',['行程業者']],['港口與遊客中心',['遊客中心']]]],
 ['潮汐天氣','#0d7d8a',[['奎壁山分海',['奎壁山']],['30天潮汐預報',['30天潮汐','潮汐預報']],['風浪天氣',['風浪']],['池西岩瀑',['池西岩瀑']]]],
 ['交通航班','#9a6700',[['航班動態',['航班']],['查機位',['查機位']],['候補資訊',['候補']],['船舶動態',['船舶']]]],
 ['地圖導航','#c2410c',[['互動地圖',['地圖']],['立體地圖',['3D']],['導航',['導航']],['路線',['路線']],['測速與科技執法',['測速']]]],
 ['活動廟宇','#b71c1c',[['月曆活動',['月曆']],['元宵資訊',['元宵']],['花火節',['花火']],['集章',['集章']],['主祀判斷',['主祀']]]],
 ['個人管理','#6b3fa0',[['重要資訊提醒',['重要資訊提醒']],['財務管理',['財務']],['機票搶票提醒',['搶票']],['特殊日期生日',['特殊日期']],['工作模式查詢',['工作模式']],['後台編修',['後台']]]]
];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);

/* 不列入的程式庫 */
const SKIP=['bear-game','adsb-list','bearbabybaby-ai.github.io','repository-name'];
/* 已知系統的中文名稱；新程式庫會自動用它網頁的標題 */
const KNOWN=['bearbear','bearbao','bearbao-mini','Lantern-Festival','penghu-bear-journey','penghu-food'];
const NAME={'bearbear':'熊熊綜合系統','bearbao':'熊寶系統','bearbao-mini':'熊寶小資訊','lantern-festival':'2027澎湖元宵','penghu-bear-journey':'熊熊澎湖之旅','penghu-food':'澎湖資訊推薦'};
const BAD=/(^|\/)(lib|libs|node_modules|tests?|assets|icons|scripts|tools|sources|docs|google-sites|build|apk|\.github|native\/www|www\/lib|leaflet|markercluster)\//i;
const CODE=/\.(html|js|cjs|mjs)$/i;
async function j(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}
async function t(u){try{const r=await fetch(u);return r.ok?await r.text():''}catch(e){return ''}}
const raw=(repo,br,p)=>`https://raw.githubusercontent.com/${OWNER}/${repo}/${br}/${p.split('/').map(encodeURIComponent).join('/')}`;
const count=(txt,kws)=>kws.reduce((s,k)=>s+txt.split(k).length-1,0);
/* 每次打開都直接掃描 GitHub 上各系統的程式碼 */
async function live(){
const repos=(await j(`https://api.github.com/users/${OWNER}/repos?per_page=100`)).filter(r=>!r.fork&&r.size>0&&!SKIP.includes(r.name.toLowerCase()));
 const systems=[];
 for(const r of repos){
  const br=r.default_branch;
  const tree=(await j(`https://api.github.com/repos/${OWNER}/${r.name}/git/trees/${br}?recursive=1`)).tree.filter(x=>x.type==='blob');
  const subs=[...new Set(tree.filter(x=>/^[^\/]+-app\/package\.json$/.test(x.path)).map(x=>x.path.split('/')[0]))];
  const files=tree.filter(x=>CODE.test(x.path)&&!BAD.test(x.path)&&!/\.min\.js$|(^|\/)sw\.js$/.test(x.path)&&x.size<3e6);
  const read=async list=>(await Promise.all(list.map(x=>t(raw(r.name,br,x.path))))).join('\n');
  const feats=txt=>CATS.flatMap(([,,fs])=>fs.filter(([,kw])=>count(txt,kw)>=2).map(([fn])=>fn));
  let name=NAME[r.name.toLowerCase()];
  if(!name){const idx=tree.find(x=>/(^|\/)index\.html$/.test(x.path));const h=idx?await t(raw(r.name,br,idx.path)):'';name=((h.match(/<title>([^<]+)/)||[])[1]||r.name).trim()}
  systems.push({n:name,u:r.homepage||`https://${OWNER.toLowerCase()}.github.io/${r.name}/`,f:feats(await read(files.filter(x=>!subs.some(s=>x.path.startsWith(s+'/')))))});
  for(const s of subs){
   let nm=s;try{nm=JSON.parse(await t(raw(r.name,br,s+'/package.json'))).productName||s}catch(e){}
   systems.push({n:nm,u:`https://github.com/${OWNER}/${r.name}/releases`,f:feats(await read(files.filter(x=>x.path.startsWith(s+'/'))))});
  }
 }
 systems.sort((a,b)=>a.n.localeCompare(b.n,'zh-Hant'));
 return systems;
}
/* GitHub 每小時只給 60 次查詢；用完時改讀最近一次掃描的結果，不會讀取失敗 */
async function load(){try{return await live()}catch(e){const r=await fetch('data.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw e;return (await r.json()).systems}}

let SY=[],FE=[],LK=[],nodes=[],zoom=1,panX=0,panY=0,sel=null,hov=null,ready=false;
function build(systems){
 /* 每個系統一種顏色（淺底、框線、圖上光點），選單、圖、資訊窗格都用同一色；順序照左側選單 */
 const TOP=['熊熊綜合系統','熊寶系統'],rk=n=>{const k=TOP.indexOf(n);return k<0?9:k};
 const order=systems.map((s,i)=>i).sort((a,b)=>rk(systems[a].n)-rk(systems[b].n));
 /* 每個系統一種鮮明顏色，選單、光點、名稱框、線條都用同一色（依左側選單順序） */
 const SC=['#0a6fb3','#f08c1e','#e0393e','#22a35a','#14a3b8','#8b5cc7','#e2a910'];
 SY=systems.map((s,i)=>({i,n:s.n,u:s.u,t:'s',col:SC[order.indexOf(i)%SC.length],bg:SC[order.indexOf(i)%SC.length]}));FE=[];LK=[];
 CATS.forEach(([cn,col,fs])=>fs.forEach(([fn,kw])=>{
  const owners=systems.map((s,i)=>s.f.includes(fn)?i:-1).filter(i=>i>=0);
  if(!owners.length)return;
  const f={i:FE.length,n:fn,c:cn,col,t:'f'};FE.push(f);owners.forEach(o=>LK.push({s:SY[o],f}));
 }));
 nodes=[...SY,...FE];nodes.forEach((n,i)=>n.ph=i*2.399);nodes.forEach(n=>n.nb=new Set());LK.forEach(l=>{l.s.nb.add(l.f);l.f.nb.add(l.s)});
 $('ttl').innerHTML=`專案索引<span>${SY.length} 個系統・${FE.length} 項功能・${LK.length} 條關聯</span>`;
}
/* 底色時間區段（台灣時間），和熊寶桌寵對話框一樣 */
function tod(){const h=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Taipei',hour:'2-digit',hour12:false}).format(new Date()))%24;document.body.dataset.tod=h>=5&&h<7?'dawn':h>=7&&h<17?'day':h>=17&&h<19?'dusk':'night'}
tod();setInterval(tod,60000);
const NIGHT=()=>document.body.dataset.tod==='night';
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=1;
function size(){const r=cv.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;if(ready&&nodes.length){panX=panY=0;fit()}}
/* 每個點是光點，名稱標在光點下方；系統是大光球 */
const RAD=n=>n.t==='s'?16:6;
function boxW(n){ctx.font=n.t==='s'?'900 18px "Noto Sans TC",sans-serif':'12px "Noto Sans TC",sans-serif';return Math.max(ctx.measureText(n.n).width+(n.t==='s'?22:10),RAD(n)*5)}
function place(){
 const R=330;
 SY.forEach((s,i)=>{const a=i/SY.length*Math.PI*2-Math.PI/2;s.x=Math.cos(a)*R;s.y=Math.sin(a)*R;s.vx=s.vy=0});
 FE.forEach(f=>{const ps=[...f.nb];let x=0,y=0;ps.forEach(p=>{x+=p.x;y+=p.y});const k=ps.length===1?1.5:.6;f.x=x/ps.length*k+(Math.random()-.5)*60;f.y=y/ps.length*k+(Math.random()-.5)*60;f.vx=f.vy=0});
 nodes.forEach(n=>{n.w=boxW(n);n.h=n.t==='s'?66:34});
}
/* 力學：連線拉近、名稱框互相推開不重疊、整體往中心收；再加上很慢的漂移 */
function step(drift){
 const N=nodes.length;
 for(let i=0;i<N;i++){const a=nodes[i];for(let j=i+1;j<N;j++){const b=nodes[j];
  let dx=b.x-a.x,dy=b.y-a.y;const ox=(a.w+b.w)/2+24-Math.abs(dx),oy=(a.h+b.h)/2+18-Math.abs(dy);
  if(ox>0&&oy>0){if(ox<oy){const p=ox*.25*(dx<0?-1:1);a.vx-=p;b.vx+=p}else{const p=oy*.25*(dy<0?-1:1);a.vy-=p;b.vy+=p}}
  const d2=dx*dx+dy*dy+1;if(d2<90000){const f=(a.t==='s'&&b.t==='s'?900:260)/d2;a.vx-=dx*f;a.vy-=dy*f;b.vx+=dx*f;b.vy+=dy*f}}}
 LK.forEach(l=>{const dx=l.f.x-l.s.x,dy=l.f.y-l.s.y,d=Math.hypot(dx,dy)||1,k=(d-150)*.006;l.s.vx+=dx/d*k*.3;l.s.vy+=dy/d*k*.3;l.f.vx-=dx/d*k;l.f.vy-=dy/d*k});
 const tm=performance.now()/1000;
 nodes.forEach((n,i)=>{n.vx-=n.x*.0012;n.vy-=n.y*.0012;
  if(drift){n.vx+=Math.cos(tm*.12+i*1.7)*.012;n.vy+=Math.sin(tm*.1+i*2.3)*.012}
  if(n===drag)return;n.vx*=.82;n.vy*=.82;n.x+=n.vx;n.y+=n.vy});
}
/* 平順漂浮：整張圖像被風吹一樣明顯飄動，相鄰的點一起動不會撞在一起，不靠力學推擠所以不會抖 */
const flo=(n,tm)=>{const p=n.x*.004+n.y*.003;return[Math.sin(tm*.55+p)*24+Math.sin(tm*.9+n.ph)*4,Math.cos(tm*.45+p*1.2)*20+Math.cos(tm*.8+n.ph)*4]};
let TM=0;
const toS=n=>{const[ox,oy]=n===drag?[0,0]:flo(n,TM);return[W/2+panX+(n.x+ox)*zoom,H/2+panY+(n.y+oy)*zoom]};
const dotS=n=>{const[x,y]=toS(n);return[x,y+(-n.h/2+RAD(n)*2.2)*zoom]};
/* 熊寶查詢結果：Q 是查到的功能，QS 是這些功能和擁有它們的系統 */
let Q=null,QS=new Set();
function rel(n){const f=sel||hov;if(!f&&Q)return QS.has(n);return !f||f===n||f.nb.has(n)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 const f=sel||hov,qm=!f&&Q;
 LK.forEach(l=>{const on=qm?Q.includes(l.f):(!f||l.s===f||l.f===f);const[x1,y1]=dotS(l.s),[x2,y2]=dotS(l.f),mx=(x1+x2)/2,my=(y1+y2)/2;
  /* 線條：平常是細的淡色直線；點選時才用該功能的顏色加粗 */
  const hl=(f||qm)&&on;ctx.strokeStyle=l.s.col;ctx.globalAlpha=(f||qm)?(on?.9:.08):.4;ctx.lineWidth=hl?2.4:1.2;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(mx+(y2-y1)*.12,my-(x2-x1)*.12,x2,y2);ctx.stroke()});
 const tm=TM;
 nodes.forEach(n=>{const[cx,cy]=toS(n),sys=n.t==='s',r=RAD(n)*zoom,[x,y]=dotS(n),on=rel(n);ctx.globalAlpha=on?1:.4;
  {const gr=r*(sys?4.2:3.6),g=ctx.createRadialGradient(x,y,0,x,y,gr);g.addColorStop(0,n.col);g.addColorStop(.25,n.col+'99');g.addColorStop(1,n.col+'00');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,gr,0,7);ctx.fill()}
  ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(x,y,r*(sys?.62:.55),0,7);ctx.fill();
  if(sys){ctx.strokeStyle=n.col;ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(x,y,r*1.25+Math.sin(tm*1.6+n.ph)*2*zoom,0,7);ctx.stroke()}
  if(f===n||(qm&&Q.includes(n))){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,r*(sys?1.7:2.2),0,7);ctx.stroke()}
  const fs=(sys?18:12)*zoom,ly=y+r*(sys?1.6:1.6)+fs*.75;
  ctx.font=`${sys?900:400} ${fs}px "Noto Sans TC",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  if(sys){const tw=ctx.measureText(n.n).width;rr(cx-tw/2-9*zoom,ly-fs*.75,tw+18*zoom,fs*1.5,6*zoom);ctx.fillStyle=n.bg;ctx.fill();ctx.strokeStyle=n.col;ctx.lineWidth=1.5;ctx.stroke()}
  ctx.fillStyle=sys?'#fff':(NIGHT()?'#e8ecf8':'#2b2b2b');ctx.shadowColor=NIGHT()?'#000':'#fff';ctx.shadowBlur=sys?0:4;ctx.fillText(n.n,cx,ly+1);ctx.shadowBlur=0});
 ctx.globalAlpha=1;
}
/* 速度：0% 停止、100% 正常、1000% 最快 */
let SPD=1,last=performance.now();
function loop(){const now=performance.now();TM+=(now-last)/1000*SPD;last=now;if(ready)draw();requestAnimationFrame(loop)}
$('sp').addEventListener('input',()=>{SPD=+$('sp').value/100;$('spv').textContent=$('sp').value+'%'});
function hit(mx,my){for(let k=nodes.length-1;k>=0;k--){const n=nodes[k],[x,y]=toS(n);if(Math.abs(mx-x)<=n.w*zoom/2&&Math.abs(my-y)<=n.h*zoom/2)return n}return null}
function vis(){const a=$('side');a.classList.toggle('on',!!$('info').innerHTML||a.classList.contains('chat'));requestAnimationFrame(size)}
function side(n){
 const sd=$('info');sel=n;document.querySelectorAll('#list button').forEach(b=>b.classList.toggle('on',SY[+b.dataset.i]===n));if(!n){sd.innerHTML='';vis();return}
 $('side').classList.remove('chat');
 const tags=a=>`<div class="tags">${a.map(x=>`<b>${esc(x)}</b>`).join('')}</div>`;
 if(n.t==='f'){
  const ss=LK.filter(l=>l.f===n).map(l=>l.s.n);
  sd.innerHTML=`<button class="x">✕</button><h2>${esc(n.n)}</h2><div class="k">有這項功能的系統（${ss.length}）</div>${tags(ss)}`;
 }else{
  const fs=LK.filter(l=>l.s===n).map(l=>l.f);
  const shared=SY.filter(s=>s!==n).map(s=>[s.n,fs.filter(f=>f.nb.has(s)).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
  sd.innerHTML=`<button class="x">✕</button><h2>${esc(n.n)}</h2><div class="k">功能（${fs.length}）</div>${tags(fs.map(f=>f.n))}<div class="k">共用功能的系統</div>${tags(shared.map(x=>`${x[0]}　${x[1]} 項`))}<p><a href="${esc(n.u)}" target="_blank" rel="noopener" style="color:var(--gold)">開啟系統</a></p>`;
 }
 sd.querySelector('.x').onclick=()=>side(null);
 vis();
}
let drag=null,panning=false,lx=0,ly=0,moved=0;
const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);[lx,ly]=pos(e);moved=0;drag=hit(lx,ly);panning=!drag;cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{const[mx,my]=pos(e),dx=mx-lx,dy=my-ly;if(drag||panning){moved+=Math.abs(dx)+Math.abs(dy);lx=mx;ly=my;if(drag){drag.x+=dx/zoom;drag.y+=dy/zoom;drag.vx=drag.vy=0}else{panX+=dx;panY+=dy}}else{hov=hit(mx,my);cv.style.cursor=hov?'pointer':'grab'}});
cv.addEventListener('pointerup',e=>{cv.style.cursor='grab';if(drag&&moved>=6){drag=null;for(let i=0;i<120;i++)step(false)}if(moved<6){const n=hit(...pos(e));side(n&&n!==sel?n:null)}drag=null;panning=false});
cv.addEventListener('pointerleave',()=>{hov=null});
cv.addEventListener('wheel',e=>{e.preventDefault();setZoom(Math.round(+zr.value*(e.deltaY<0?1.08:.93)))},{passive:false});
const zr=$('zr');
function setZoom(v){v=Math.max(40,Math.min(200,v));zr.value=v;zoom=v/100;$('zv').textContent=v+'%'}
zr.addEventListener('input',()=>setZoom(+zr.value));
$('zIn').onclick=()=>setZoom(+zr.value+10);$('zOut').onclick=()=>setZoom(+zr.value-10);
$('bReset').onclick=()=>{panX=panY=0;side(null);place();for(let i=0;i<400;i++)step(false);fit()};
function fit(){let mx=1,my=1;nodes.forEach(n=>{mx=Math.max(mx,Math.abs(n.x)+n.w/2+30);my=Math.max(my,Math.abs(n.y)+n.h/2+40)});setZoom(Math.round(Math.max(40,Math.min(100,Math.min(W/2/mx,H/2/my)*95))))}
addEventListener('resize',size);

/* 點熊寶：右側窗格改成熊寶查詢（和熊寶桌寵獨立版一樣的查詢方式）；點選單就換回系統資訊，兩者不同時出現 */
window.deskMini=()=>{};window.deskMax=()=>{};
function openChat(){const a=$('side'),f=$('desk');
 if(!f.src)f.src='desk.html?'+Date.now();
 a.classList.toggle('chat');if(a.classList.contains('chat'))side(null);vis();
 if(a.classList.contains('chat')){try{const w=f.contentWindow;w.deskFocus&&w.deskFocus(false)}catch(e){}}
}

/* 熊寶：和熊寶系統裡的熊寶桌寵一樣——同一套動作圖與服裝判斷（節日優先，否則依季節），
   在圖的下緣走來走去、隨機耍呆（揮手、拍手、打哈欠、看書、滑手機…），晚上偶爾睡覺；
   可以抓起來（掙扎），放開會掉下來再拍拍灰塵；點一下開熊寶查詢 */
(function(){
 const PA='https://raw.githubusercontent.com/BearBabyBaby-ai/bearbao/pet-assets/';
 const pet=$('pet'),wrap=$('wrap');
 const tz=()=>new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Taipei'}));
 function outfitNow(){const t=tz(),m=t.getMonth()+1,d=t.getDate();
  if(m===12&&(d===24||d===25))return 'christmas';
  try{let lm=0,ld=0,leap=false;for(const p of new Intl.DateTimeFormat('en-u-ca-chinese',{month:'numeric',day:'numeric'}).formatToParts(t)){if(p.type==='month'){lm=parseInt(p.value,10);leap=/bis/.test(p.value)}if(p.type==='day')ld=parseInt(p.value,10)}
   if(!leap){if(lm===1&&ld>=1&&ld<=5)return 'lunar_new_year';if(lm===1&&ld===15)return 'lantern';if(lm===5&&ld===5)return 'dragon_boat';if(lm===8&&ld===15)return 'mid_autumn'}}catch(e){}
  return m>=3&&m<=5?'spring':m>=6&&m<=8?'summer':m>=9&&m<=11?'autumn':'winter'}
 let MF=null,O='default',byId={},blobs={},x=null,dir=1,cur='',timer=null,walking=0,last=0,held=false;
 const FUN=['wave','clap','giggle','jump','curious_tilt','scratch_head','look_back','sniff','ears_perk','facepalm','point_down','beckon','blow_kiss','yawn','stretch_up','duck','eat_snack','eat_bento','dust_off','roll_left'];
 const LONG=['read_book','use_phone','play_toy','tail_wag','sit_down'];
 const clipOf=act=>{const v=MF.outfits[O]&&MF.outfits[O].variants&&MF.outfits[O].variants[act];return byId[v||act]||null};
 async function src(c){if(!blobs[c.file]){try{blobs[c.file]=await (await fetch(PA+c.file)).blob()}catch(e){return PA+c.file}}return URL.createObjectURL(blobs[c.file])}
 async function play(act,ms){const c=clipOf(act);if(!c)return false;cur=act;const u=await src(c);if(cur!==act)return true;const old=pet.src;pet.src=u;if(old.startsWith('blob:'))setTimeout(()=>URL.revokeObjectURL(old),500);clearTimeout(timer);timer=setTimeout(next,ms||(c.playback==='once'?c.duration_ms:c.duration_ms*3));return true}
 const W=()=>wrap.clientWidth,PW=()=>pet.offsetWidth||140;
 function place(){if(x==null)x=W()-PW()-10;x=Math.max(0,Math.min(W()-PW(),x));pet.style.left=x+'px';pet.style.right='auto'}
 function step(t){const dt=last?(t-last)/1000:0;last=t;
  if(walking&&!held){x+=dir*walking*dt*SPD;if(x<=0||x>=W()-PW()){dir=-dir;play(dir>0?'walk_right':'walk_left',3000+Math.random()*4000)}place()}
  requestAnimationFrame(step)}
 function next(){if(held)return;walking=0;const r=Math.random(),h=tz().getHours(),night=h>=23||h<6;
  if(night&&r<.25){play('pillow_sleep',8000+Math.random()*8000);return}
  if(r<.35){dir=Math.random()<.5?-1:1;walking=55;play(dir>0?'walk_right':'walk_left',2500+Math.random()*4000);return}
  if(r<.45){dir=1;walking=130;play('run_right',1500+Math.random()*1500);return}
  if(r<.6){play(LONG[Math.floor(Math.random()*LONG.length)],3000+Math.random()*4000);return}
  if(r<.85){const a=FUN[Math.floor(Math.random()*FUN.length)];if(clipOf(a)){play(a);return}}
  play('idle_blink',2000+Math.random()*3000)}
 /* 抓起來、放開掉下來、點一下開查詢 */
 let px=0,py=0,mv=0;
 pet.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();pet.setPointerCapture(e.pointerId);px=e.clientX;py=e.clientY;mv=0});
 pet.addEventListener('pointermove',e=>{if(!pet.hasPointerCapture(e.pointerId))return;const dx=e.clientX-px,dy=e.clientY-py;mv+=Math.abs(dx)+Math.abs(dy);px=e.clientX;py=e.clientY;
  if(mv>8){if(!held){held=true;walking=0;clearTimeout(timer);play('grab_struggle',60000)}x+=dx;place();const b=parseFloat(pet.style.bottom)||4;pet.style.bottom=Math.max(4,b-dy)+'px'}});
 pet.addEventListener('pointerup',e=>{if(!held){openChat();return}held=false;clearTimeout(timer);play('falling',1e6);
  const fall=()=>{const b=parseFloat(pet.style.bottom)||4;if(b>4){pet.style.bottom=Math.max(4,b-14)+'px';requestAnimationFrame(fall)}else{play('dust_off')}};fall()});
 fetch(PA+'manifest.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(mf=>{MF=mf;O=outfitNow();mf.animations.forEach(a=>byId[a.id]=a);place();play('wave');requestAnimationFrame(step);
  setInterval(()=>{O=outfitNow()},600000)}).catch(()=>{});
 addEventListener('resize',place);
})();
load().then(s=>{build(s);const TOP=['熊熊綜合系統','熊寶系統'],rk=x=>{const k=TOP.indexOf(x.n);return k<0?9:k};$('list').innerHTML=[...SY].sort((a,b)=>rk(a)-rk(b)).map(x=>`<button data-i="${x.i}" style="--sc:${x.col}">${esc(x.n)}</button>`).join('');$('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const n=SY[+b.dataset.i];side(sel===n?null:n)};size();place();for(let i=0;i<400;i++)step(false);fit();$('msg').remove();ready=true;loop();
}).catch(e=>{$('msg').textContent='讀取失敗，請稍後重新整理'});
}
</script>
